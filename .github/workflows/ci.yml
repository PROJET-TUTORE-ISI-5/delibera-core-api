name: Intégration continue

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  construire-et-tester:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compiler et lancer les tests (Testcontainers utilise le Docker du runner)
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
