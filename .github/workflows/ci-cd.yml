# CI/CD de l'API Delibera, déployée en conteneurs (infrastructure Terraform : dépôt PROJET-TUTORE-ISI-5/infra)
#
#  - push sur main ou develop, demande de fusion vers main ou develop :
#      1. compilation, tests unitaires et d'intégration (Testcontainers), couverture
#      2. image Docker, puis test de fumée : l'image démarre avec PostgreSQL grâce à
#         deploy/compose.prod.yaml (profils prod,docker, migrations Flyway, /actuator/health, 401 sur /api/v1)
#  - push sur main : publication de l'image sur ghcr.io (étiquette = commit), puis déploiement sur l'EC2
#      sauvegarde de la base, nouvelle version, contrôle de santé, retour arrière automatique,
#      puis vérification depuis Internet
#  - lancement manuel (Actions > CI/CD > Run workflow) sur main :
#      « deployer » reconstruit et redéploie main ; « revenir » réactive la version précédente
#
# À renseigner dans GitHub (Settings > Secrets and variables > Actions), comme pour delibera-ui :
#   variable EC2_HOST    IP publique de l'instance (terraform output -raw public_ip)
#   secret   EC2_SSH_KEY clé privée SSH dont la clé publique a été passée à Terraform
# Ces deux valeurs peuvent être définies une seule fois au niveau de l'organisation.
# Le registre ghcr.io utilise le jeton fourni par GitHub Actions : rien à créer.
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      action:
        description: "deployer : reconstruire et redéployer main ; revenir : réactiver la version précédente"
        type: choice
        options: [deployer, revenir]
        default: deployer

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compilation et tests
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deployer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compiler et lancer tous les tests (Testcontainers utilise le Docker du runner)
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Image Docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.noms.outputs.image }}
    env:
      PUBLIER: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Nommer l'image
        id: noms
        run: |
          # ghcr.io impose des minuscules ; l'étiquette est le commit (12 caractères)
          depot="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "depot=$depot" >> "$GITHUB_OUTPUT"
          echo "image=$depot:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ steps.noms.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=delibera-core-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tester l'image avec PostgreSQL (configuration de production)
        env:
          DELIBERA_API_IMAGE: ${{ steps.noms.outputs.image }}
        run: |
          fichier="$RUNNER_TEMP/delibera-api.env"
          {
            echo "DELIBERA_DB_USER=delibera"
            echo "DELIBERA_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DELIBERA_JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "DELIBERA_CORS_ORIGINES=http://localhost"
          } > "$fichier"
          export DELIBERA_ENV_FILE="$fichier"
          compose=(docker compose --project-name delibera-fumee --env-file "$fichier" -f deploy/compose.prod.yaml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d
          sante=""
          for _ in $(seq 1 60); do
            sante="$(curl -fsS --max-time 5 http://127.0.0.1:8080/actuator/health || true)"
            case "$sante" in *'"status":"UP"'*) break ;; esac
            sleep 3
          done
          case "$sante" in
            *'"status":"UP"'*) echo "✔ santé : $sante" ;;
            *) "${compose[@]}" logs --no-color --tail 200 api; echo "::error::l'image ne démarre pas (santé : ${sante:-aucune réponse})"; exit 1 ;;
          esac
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/verification-deploiement)"
          test "$code" = 401 || { "${compose[@]}" logs --no-color --tail 200 api; echo "::error::réponse $code au lieu de 401 sur /api/v1"; exit 1; }
          echo "✔ /api/v1 protégé (401)"
          "${compose[@]}" down -v

      - name: Se connecter à ghcr.io
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        if: env.PUBLIER == 'true'
        env:
          IMAGE: ${{ steps.noms.outputs.image }}
          DEPOT: ${{ steps.noms.outputs.depot }}
        run: |
          docker push "$IMAGE"
          docker tag "$IMAGE" "$DEPOT:main"
          docker push "$DEPOT:main"
          echo "✔ image publiée : $IMAGE"

  deploy:
    name: Déploiement sur EC2
    needs: image
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'deployer'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}/api/v1
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Récupérer les fichiers de déploiement
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Préparer SSH
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "::error::variable EC2_HOST manquante"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::secret EC2_SSH_KEY manquant"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Envoyer et activer la version
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          IMAGE: ${{ needs.image.outputs.image }}
          JETON_REGISTRE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ServerAliveInterval=30)
          cp deploy/compose.prod.yaml "$RUNNER_TEMP/delibera-api-compose.yaml"
          scp "${opts[@]}" "$RUNNER_TEMP/delibera-api-compose.yaml" deploy/remote-deploy.sh "ubuntu@$EC2_HOST:/tmp/"
          # Le jeton passe par l'entrée standard (jamais dans la ligne de commande) ; il expire avec ce job.
          # shellcheck disable=SC2029 # l'image et l'utilisateur sont calculés sur le runner : c'est voulu
          printf '%s\n' "$JETON_REGISTRE" \
            | ssh "${opts[@]}" "ubuntu@$EC2_HOST" "bash /tmp/remote-deploy.sh deployer '$IMAGE' '$GITHUB_ACTOR'"

      - name: Vérifier depuis Internet
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          # Sans jeton, toute route de l'API répond 401 : la chaîne Nginx -> API -> Spring Security fonctionne.
          code=000
          for _ in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/api/v1/verification-deploiement" || true)"
            [ "$code" = 401 ] && break
            sleep 3
          done
          test "$code" = 401 || { echo "::error::réponse $code au lieu de 401 sur /api/v1"; exit 1; }
          echo "✔ API en ligne : http://$EC2_HOST/api/v1"

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key

  rollback:
    name: Retour à la version précédente
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'revenir'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}/api/v1
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Récupérer le script de déploiement
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Préparer SSH
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "::error::variable EC2_HOST manquante"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::secret EC2_SSH_KEY manquant"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Réactiver la version précédente
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ServerAliveInterval=30)
          scp "${opts[@]}" deploy/remote-deploy.sh "ubuntu@$EC2_HOST:/tmp/"
          ssh "${opts[@]}" "ubuntu@$EC2_HOST" "bash /tmp/remote-deploy.sh revenir" < /dev/null

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key