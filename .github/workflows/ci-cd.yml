# CI/CD de l'API Delibera (infrastructure Terraform : dépôt PROJET-TUTORE-ISI-5/infra)
#
#  - push sur main ou develop, demande de fusion vers main ou develop :
#      compilation, tests unitaires et d'intégration (Testcontainers), couverture, JAR
#  - push sur main : déploiement sur l'EC2
#      sauvegarde de la base, nouvelle version, contrôle de santé, retour arrière automatique,
#      puis vérification depuis Internet
#  - lancement manuel (Actions > CI/CD > Run workflow) sur main :
#      « deployer » redéploie main ; « revenir » réactive la version précédente sans recompiler
#
# À renseigner dans GitHub (Settings > Secrets and variables > Actions), comme pour delibera-ui :
#   variable EC2_HOST    IP publique de l'instance (terraform output -raw public_ip)
#   secret   EC2_SSH_KEY clé privée SSH dont la clé publique a été passée à Terraform
# Ces deux valeurs peuvent être définies une seule fois au niveau de l'organisation.
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      action:
        description: "deployer : redéployer main ; revenir : réactiver la version précédente"
        type: choice
        options: [deployer, revenir]
        default: deployer

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compilation et tests
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deployer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compiler et lancer tous les tests (Testcontainers utilise le Docker du runner)
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Préparer le JAR
        run: |
          jar="$(find target -maxdepth 1 -name 'delibera-core-api-*.jar' ! -name '*.original' | head -n 1)"
          test -n "$jar" || { echo "::error::JAR introuvable dans target/"; exit 1; }
          cp "$jar" delibera-api.jar
          echo "JAR : $jar ($(du -h delibera-api.jar | cut -f1))"

      - name: Publier le JAR
        uses: actions/upload-artifact@v7
        with:
          name: delibera-api
          path: delibera-api.jar
          retention-days: 7

  deploy:
    name: Déploiement sur EC2
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'deployer'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}/api/v1
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Récupérer le script de déploiement
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Récupérer le JAR testé
        uses: actions/download-artifact@v8
        with:
          name: delibera-api

      - name: Préparer SSH
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "::error::variable EC2_HOST manquante"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::secret EC2_SSH_KEY manquant"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Envoyer et activer la version
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ServerAliveInterval=30)
          scp "${opts[@]}" delibera-api.jar deploy/remote-deploy.sh "ubuntu@$EC2_HOST:/tmp/"
          # shellcheck disable=SC2029 # la version est calculée sur le runner : c'est voulu
          ssh "${opts[@]}" "ubuntu@$EC2_HOST" "bash /tmp/remote-deploy.sh deployer ${GITHUB_SHA::12}"

      - name: Vérifier depuis Internet
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          # Sans jeton, toute route de l'API répond 401 : la chaîne Nginx -> API -> Spring Security fonctionne.
          code=000
          for _ in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/api/v1/verification-deploiement" || true)"
            [ "$code" = 401 ] && break
            sleep 3
          done
          test "$code" = 401 || { echo "::error::réponse $code au lieu de 401 sur /api/v1"; exit 1; }
          echo "✔ API en ligne : http://$EC2_HOST/api/v1"

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key

  rollback:
    name: Retour à la version précédente
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'revenir'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}/api/v1
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Récupérer le script de déploiement
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Préparer SSH
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "::error::variable EC2_HOST manquante"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::secret EC2_SSH_KEY manquant"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Réactiver la version précédente
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ServerAliveInterval=30)
          scp "${opts[@]}" deploy/remote-deploy.sh "ubuntu@$EC2_HOST:/tmp/"
          ssh "${opts[@]}" "ubuntu@$EC2_HOST" "bash /tmp/remote-deploy.sh revenir"

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
