# Serveur : toutes les valeurs sensibles viennent des variables d'environnement
# (DELIBERA_DB_URL, DELIBERA_DB_USER, DELIBERA_DB_PASSWORD, DELIBERA_JWT_SECRET,
# DELIBERA_CORS_ORIGINES, DELIBERA_SMTP_*).
server:
  # L'API est derrière Nginx : elle n'écoute que sur la machine (SERVER_ADDRESS=127.0.0.1 sur l'EC2).
  forward-headers-strategy: framework
  # Au redémarrage (déploiement), les requêtes en cours se terminent avant l'arrêt.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
